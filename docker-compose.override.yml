version: '3.7'
# services:
#   mediawiki:
#     # On Linux, these lines ensure file ownership is set to your host user/group
#     user: "${MW_DOCKER_UID}:${MW_DOCKER_GID}"


services:

  statsd-exporter:
    ports:
      - "9112:9112"
    image: docker.io/prom/statsd-exporter:v0.22.2
    command: "--web.listen-address=:9112"

  mediawiki:
    image: docker-registry.wikimedia.org/dev/buster-php74-fpm:latest

  mariadb-main:
    image: 'bitnami/mariadb:latest'
    volumes:
      - mariadbdata:/bitnami/mariadb
    ports:
      - "3306:3306"
    environment:
      - MARIADB_REPLICATION_MODE=master
      - MARIADB_REPLICATION_USER=repl_user
      - MARIADB_REPLICATION_PASSWORD=repl_password
      - MARIADB_ROOT_PASSWORD=main_root_password
      - MARIADB_USER=my_user
      - MARIADB_PASSWORD=my_password
      - MARIADB_DATABASE=my_database
  mariadb-replica:
    image: 'bitnami/mariadb:latest'
    ports:
      - "3307:3306"
    depends_on:
      - mariadb-main
    environment:
      - MARIADB_REPLICATION_MODE=slave
      - MARIADB_REPLICATION_USER=repl_user
      - MARIADB_REPLICATION_PASSWORD=repl_password
      - MARIADB_MASTER_HOST=mariadb-main
      - MARIADB_MASTER_PORT_NUMBER=3306
      - MARIADB_MASTER_ROOT_PASSWORD=main_root_password

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.0.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # Kafka broker
  broker:
    image: confluentinc/cp-kafka:7.0.1
    container_name: broker
    ports:
    # To learn about configuring Kafka for access across networks see
    # https://www.confluent.io/blog/kafka-client-cannot-connect-to-broker-on-aws-on-docker-etc/
     - "9092:9092"
    depends_on:
     - zookeeper
    environment:
     KAFKA_BROKER_ID: 1
     KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
     KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
     KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://broker:29092
     KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
     KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
     KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  flink-jobmanager:
    image: flink-base:v1
    volumes:
      # cache/flink/warehouse will be used to store Flink SQL catalogs
      - ./flink-cdc-spike/cache/flink/warehouse:/user/hive/warehouse
    ports:
      - "8081:8081"
    hostname: jobmanager
    # command: HADOOP_CLASSPATH=$(/opt/hadoop-2.10.2/bin/hadoop classpath) jobmanager
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        jobmanager.rest.port: 8081
        execution.checkpointing.interval: 3000


  flink-taskmanager:
    image: flink-base:v1
    volumes:
      # cache/flink/warehouse will be used to store Flink SQL catalogs
      - ./flink-cdc-spike/cache/flink/warehouse:/user/hive/warehouse
    # run more task managers!
    deploy:
      replicas: 8
    hostname: taskmanager
    depends_on:
      - flink-jobmanager
    # command: HADOOP_CLASSPATH=$(/opt/hadoop-2.10.2/bin/hadoop classpath) taskmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        jobmanager.rest.port: 8081
        execution.checkpointing.interval: 3000

  # flink launcher
  flink-launcher:
    image: flink-base:v1
    volumes:
      # flink-cdc-pipeline-conf has flink cdc pipeline confs
      - ./flink-cdc-spike/flink-cdc-pipeline-conf:/tmp/flink-cdc-pipeline-conf
      # cache/flink/warehouse will be used to store Flink SQL catalogs
      - ./flink-cdc-spike/cache/flink/warehouse:/user/hive/warehouse
    hostname: flink-launcher
    depends_on:
      - flink-jobmanager
      - flink-taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        jobmanager.rest.port: 8081
        rest.address: jobmanager

  flink-jobmanager-kafka-to-paimon:
    image: flink-base:v1
    volumes:
      # cache/flink/warehouse will be used to store Flink SQL catalogs
      - ./flink-cdc-spike/cache/flink/warehouse:/user/hive/warehouse
      - ./flink-cdc-spike/dockerfiles/dependencies/flink-1.17.0/paimon-action:/opt/flink/usrlib/paimon
      - ./flink-cdc-spike/dockerfiles/dependencies/flink-1.17.0/flink/opt:/opt/flink/usrlib/opt
    ports:
      - "8082:8082"
    command: >
      standalone-job
      --job-classname org.apache.paimon.flink.action.FlinkActions
      kafka_sync_database
      --warehouse file:/user/hive/warehouse/paimon0
      --database mediawiki1
      --kafka_conf properties.bootstrap.servers=PLAINTEXT://broker:29092
      --kafka_conf topic=my_database.revision\;my_database.page\;my_database.slots\;my_database.content
      --kafka_conf scan.startup.mode=earliest-offset
      --kafka_conf properties.group.id=kafka_paimon1
      --kafka_conf value.format=debezium-json
      --catalog_conf metastore=hive
      --catalog_conf uri=thrift://hive-metastore:9083
      --table_conf bucket=4
      --table_conf changelog-producer=input
      --table_conf sink.parallelism=4
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager-kafka-to-paimon
        jobmanager.rest.port: 8082
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2


  flink-taskmanager-kafka-to-paimon:
    image: flink-base:v1
    volumes:
      # cache/flink/warehouse will be used to store Flink SQL catalogs
      - ./flink-cdc-spike/cache/flink/warehouse:/user/hive/warehouse
    command: taskmanager
    # run more task managers!
    deploy:
      replicas: 4
    depends_on:
      - flink-jobmanager-kafka-to-paimon
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager-kafka-to-paimon
        jobmanager.rest.port: 8082
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2


  hive-metastore:
    image: ghcr.io/criccomini/hive-metastore-standalone:latest
    hostname: hive-metastore
    ports:
      - "9083:9083"

  mariadb-client:
    image: logiqx/mysql-client
    command: mysql --host=mariadb-main --database=my_database --user=root --password=main_root_password
    depends_on:
      - mariadb-main

volumes:
  mariadbdata:
    driver: local

